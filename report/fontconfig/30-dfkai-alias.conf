<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- 標楷體 (DFKai-SB) is a Windows font; render it with the MOE standard Kai, then AR PL UKai TW -->
<fontconfig>
  <alias binding="same">
    <family>標楷體</family>
    <prefer><family>TW-MOE-Std-Kai</family><family>AR PL UKai TW</family></prefer>
  </alias>
  <alias binding="same">
    <family>DFKai-SB</family>
    <prefer><family>TW-MOE-Std-Kai</family><family>AR PL UKai TW</family></prefer>
  </alias>
</fontconfig>
