name: youbike-logger

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (UTC clock, but the logger writes local time)
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab

permissions:
  contents: write            # the job commits the snapshot back to this repository

concurrency:
  group: youbike-logger
  cancel-in-progress: false  # never kill a run that is in the middle of committing

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AREA_CODES: "12"                 # 12 = Kaohsiung
      CENTER: "22.6273,120.2658"       # NSYSU
      RADIUS_KM: "5"                   # stations within 5 km of NSYSU (~310); "0" = all of Kaohsiung
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch snapshot
        run: python3 logger/fetch_youbike.py

      - name: Commit and push
        run: |
          git config user.name  "youbike-logger"
          git config user.email "youbike-logger@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "nothing to commit"; exit 0
          fi
          git commit -m "log $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          for attempt in 1 2 3; do
            git push && exit 0
            echo "push failed (attempt $attempt), rebasing on remote"
            git pull --rebase --autostash || true
            sleep 5
          done
          exit 1
