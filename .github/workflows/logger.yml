name: youbike-logger

# How this works
# --------------
# GitHub's cron scheduler is unreliable for new, quiet repositories (it fired only a
# handful of times per day for this repo), so one run does not take one snapshot: it
# stays alive for LOOP_MINUTES, takes a snapshot every 10 minutes and commits each one
# (logger/loop.sh). Just before it ends it starts its successor with workflow_dispatch,
# so the chain continues around the clock.
#
# Three things can break the chain, and each has its own remedy:
#   - The YouBike API answers some runners with HTTP 503 for their whole life. The loop
#     then gives up at once and its successor tries from a new runner.
#   - A runner dies ("lost communication with the server"). The cron below is the backup:
#     a cron run starts logging when the repository shows no heartbeat for 25 minutes
#     (logger/should_run.py) and exits within seconds otherwise.
#   - Two loops end up side by side. Every commit carries its run id; the younger loop
#     stands down when it sees the older one's commits.
#
# Normal picture on the Actions page: one long yellow run at a time (hours), plus short
# green ones from the cron that found the loop alive.

on:
  schedule:
    - cron: "7,27,47 * * * *"      # backup, three times an hour (often delayed or skipped by GitHub)
  workflow_dispatch:
    inputs:
      parent:
        description: "run id of the run that started this one (filled in automatically)"
        required: false
        default: ""
      streak:
        description: "runs in a row that the YouBike API refused (filled in automatically)"
        required: false
        default: "0"

permissions:
  contents: write                  # commit snapshots back to this repository
  actions: write                   # start the next run

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 358           # GitHub kills jobs at 360
    env:
      AREA_CODES: "12"             # 12 = Kaohsiung
      CENTER: "22.6273,120.2658"   # NSYSU
      RADIUS_KM: "5"               # stations within 5 km of NSYSU (~310); "0" = all of Kaohsiung
      LOOP_MINUTES: "340"          # how long one run keeps logging before handing over
      GH_TOKEN: ${{ github.token }}
      PARENT: ${{ inputs.parent }}
      STREAK: ${{ inputs.streak || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check that no other run is already logging
        id: guard
        run: |
          decision=$(python3 logger/should_run.py "${PARENT}")
          echo "decision=${decision}" >> "$GITHUB_OUTPUT"
          echo "decision: ${decision}"

      - name: Install the demo dependencies (predictor, chain, route search)
        if: steps.guard.outputs.decision == 'run'
        run: |
          pip install -q numpy pandas scipy lightgbm \
            || echo "pip failed, snapshots are still logged but the demo state is not refreshed"

      - name: Log every 10 minutes
        id: loop
        if: steps.guard.outputs.decision == 'run'
        run: bash logger/loop.sh

      - name: Start the next run
        if: always() && steps.guard.outputs.decision == 'run' && steps.loop.outputs.next != 'no'
        run: |
          for attempt in 1 2 3; do
            gh workflow run logger.yml --ref "${GITHUB_REF_NAME}" \
              -f parent="${GITHUB_RUN_ID}" -f streak="${{ steps.loop.outputs.streak || '0' }}" && break
            echo "could not start the next run (attempt $attempt)"; sleep 20
          done
