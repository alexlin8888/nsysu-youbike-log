  --out: #ff8076; --out-fill: #cf3a30; --out-soft: #401c1a; --gone: #8c2a22;
  --r0: #2a3744; --r1: #5c4033; --r2: #a55a3a; --r3: #e2643c; --r4: #ffa277;
  --map-bg: #17212b; --tile-filter: invert(1) hue-rotate(180deg) saturate(0.35) brightness(0.8) contrast(0.9);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.4), 0 4px 16px rgba(0, 0, 0, 0.45);
  --shadow-2: 0 -2px 24px rgba(0, 0, 0, 0.6); color-scheme: dark; }

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: var(--font-ui); font-size: 14.5px; line-height: 1.5; overflow: hidden;
  -webkit-text-size-adjust: 100%; text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* ---------- frame ---------- */
.shell { height: 100vh; height: 100dvh; display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; min-height: var(--top-h); background: var(--surface); border-bottom: 1px solid var(--line);
  padding: 8px max(var(--pad), var(--safe-r)) 8px max(var(--pad), var(--safe-l)); padding-top: calc(8px + var(--safe-t)); min-width: 0; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; color: inherit; }
.brand svg { flex: none; }
.brand .wordmark { font: 600 19px/1 var(--font-num); letter-spacing: 0.01em; white-space: nowrap; }
.brand .where { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .spacer { flex: 1 1 0; min-width: 0; }
.mini { display: none; }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok-fill); flex: none; }
.status.stale .dot { background: var(--low-fill); }
.status.replay .dot { background: var(--accent); }
.status.wait .dot { background: var(--ink-3); }

.seg { display: inline-flex; background: var(--surface-3); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 8px; padding: 5px 12px; font-size: 13px; color: var(--ink-2); min-height: 30px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(16, 32, 47, 0.16); }

.side { grid-column: 1; grid-row: 2; display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; background: var(--surface); border-right: 1px solid var(--line); }
.mapwrap { grid-column: 2; grid-row: 2; position: relative; z-index: 0; min-width: 0; min-height: 0; background: var(--map-bg); }
#map { position: absolute; inset: 0; background: var(--map-bg); }
#map.picking { cursor: crosshair; }
.leaflet-tile-pane { filter: var(--tile-filter); }

/* ---------- the bell board ---------- */
.board { background: var(--board); color: var(--board-ink); padding: 16px var(--pad) 12px; padding-left: max(var(--pad), var(--safe-l)); }
.board .lbl { font-size: 12.5px; color: var(--board-mute); }
.board .line { display: flex; align-items: baseline; gap: 14px; margin-top: 2px; flex-wrap: wrap; }
.board .at { font: 600 38px/1 var(--font-num); letter-spacing: 0.01em; font-variant-numeric: tabular-nums; }
.board .left { font: 600 22px/1 var(--font-num); color: var(--bell); font-variant-numeric: tabular-nums; }
.board .left small { font: 500 13px var(--font-ui); margin-left: 3px; }
.board .at.calm { font: 600 24px/1.25 var(--font-ui); letter-spacing: 0; }
.board .note { font-size: 13px; color: var(--board-mute); }
.ruler { position: relative; height: 36px; margin-top: 12px; }
.ruler .axis { position: absolute; left: 0; right: 0; top: 13px; height: 1px; background: var(--board-line); }
.ruler .tick { position: absolute; top: 8px; width: 2px; height: 11px; background: var(--board-mute); opacity: 0.55; transform: translateX(-1px); border-radius: 1px; }
.ruler .tick.major { height: 17px; top: 5px; opacity: 0.9; }
.ruler .tick.past { opacity: 0.28; }
.ruler .tick.next { background: var(--bell); opacity: 1; }
.ruler .now { position: absolute; top: 9px; width: 9px; height: 9px; border-radius: 50%; background: var(--board-ink); transform: translateX(-4.5px); box-shadow: 0 0 0 3px var(--board); }
.ruler .hr { position: absolute; top: 24px; font: 500 10.5px/1 var(--font-num); color: var(--board-mute); transform: translateX(-50%); }
.ruler .hr.next { color: var(--bell); }

/* ---------- tabs: a segmented control in the side column, a bottom bar on phones ---------- */
.tabs { display: flex; gap: 2px; margin: 12px var(--pad) 0; margin-left: max(var(--pad), var(--safe-l)); background: var(--surface-3); border-radius: 12px; padding: 3px; }
.tabs button { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: transparent; border-radius: 9px; min-height: 50px; padding: 6px 4px;
  font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }   /* icon above label: five tabs fit the side column in either language */
.tabs button svg { flex: none; }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(16, 32, 47, 0.16); }

/* ---------- the scrolling column / the sheet ---------- */
.panel { min-height: 0; display: grid; grid-template-rows: minmax(0, 1fr); }
.grip { display: none; }
.scroll { overflow-y: auto; overscroll-behavior: contain; padding: 14px var(--pad) 28px; padding-left: max(var(--pad), var(--safe-l)); min-height: 0; scrollbar-width: thin; }
.pane { display: grid; gap: 20px; align-content: start; }
.pane > section { min-width: 0; }
h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 28px; }
h2 .sub { font-weight: 400; color: var(--ink-3); font-size: 12.5px; }

/* search and origin */
.search { position: relative; }
.search input { width: 100%; height: 44px; border: 1px solid transparent; border-radius: 12px; background: var(--surface-3); padding: 0 14px 0 40px; font-size: 15px; -webkit-appearance: none; appearance: none; }
.search input:focus { background: var(--surface); border-color: var(--accent); outline: none; }
.search input::placeholder { color: var(--ink-3); }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.search .ico { position: absolute; left: 13px; top: 13px; color: var(--ink-3); pointer-events: none; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: var(--shadow-1); z-index: 30; max-height: 300px; overflow-y: auto; padding: 4px; }
.results button { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 9px; padding: 9px 10px; font-size: 14px; min-height: 44px; }
.results button:hover, .results button:focus-visible { background: var(--surface-2); outline: none; }
.results .alt { display: block; color: var(--ink-3); font-size: 12px; }
.results .badge { width: 30px; height: 30px; font-size: 14px; }
.results .none { padding: 12px; color: var(--ink-2); font-size: 13.5px; }
.origin { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.origin .k { font-size: 13px; color: var(--ink-2); }
.opt { border: 1px solid var(--line-2); background: var(--surface); border-radius: 999px; padding: 5px 13px; font-size: 13px; min-height: 34px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }

/* station rows: the round badge is the same mark as on the map (bikes now, coloured by the 30-minute outlook) */
.badge { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 600 17px/1 var(--font-num); color: #fff; flex: none; font-variant-numeric: tabular-nums; }
.badge.g { background: var(--ok-fill); } .badge.y { background: var(--low-fill); color: #10202f; } .badge.o { background: var(--risk-fill); }
.badge.r { background: var(--out-fill); } .badge.x { background: var(--gone); } .badge.n { background: var(--surface-3); color: var(--ink-3); }
.state { font-weight: 600; }
.state.g { color: var(--ok); } .state.y { color: var(--low); } .state.o { color: var(--risk); } .state.r, .state.x { color: var(--out); } .state.n { color: var(--ink-3); }
.rows { list-style: none; margin: 0 calc(-1 * var(--pad)); padding: 0; }
.row { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; column-gap: 12px; align-items: center; padding: 11px var(--pad); min-height: 64px; cursor: pointer; position: relative; }
.row + .row::before { content: ""; position: absolute; left: calc(var(--pad) + 52px); right: var(--pad); top: 0; border-top: 1px solid var(--line); }
.row:hover { background: var(--surface-2); }
.row:focus-visible { outline-offset: -2px; }
.row.sel { background: var(--accent-soft); }
.row .nm { display: block; font-weight: 600; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
.row .nm .star { color: var(--low-fill); margin-left: 4px; }
.row .sub { font-size: 12.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; column-gap: 10px; line-height: 1.45; margin-top: 1px; }
.row .walk { text-align: right; white-space: nowrap; font: 600 18px/1.1 var(--font-num); font-variant-numeric: tabular-nums; }
.row .walk small { display: block; font: 400 11.5px/1.3 var(--font-ui); color: var(--ink-3); }
.rows .empty { margin: 0 var(--pad); }
.empty { font-size: 13.5px; color: var(--ink-2); background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
.more { width: 100%; border: 0; background: var(--surface-2); border-radius: 12px; min-height: 42px; font-size: 13.5px; color: var(--ink-2); margin-top: 6px; }
.more:hover { background: var(--surface-3); color: var(--ink); }

/* the suggestions: a station for now (green) and one for after the next class end (the board's colours) */
.best { display: grid; gap: 8px; }
.pick { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; column-gap: 12px; align-items: center; padding: 12px 14px; border-radius: 16px; background: var(--ok-soft); cursor: pointer; width: 100%; text-align: left; border: 0; }
.pick .why { display: block; font-size: 12.5px; color: var(--ok); font-weight: 600; line-height: 1.35; }
.pick .nm { display: block; font-weight: 600; font-size: 16px; line-height: 1.3; }
.pick .sub { font-size: 12.5px; color: var(--ink-2); display: flex; flex-wrap: wrap; column-gap: 10px; }
.pick .walk { text-align: right; white-space: nowrap; font: 600 20px/1.1 var(--font-num); }
.pick .walk small { display: block; font: 400 11.5px/1.3 var(--font-ui); color: var(--ink-2); }
.pick.none { background: var(--surface-2); cursor: default; grid-template-columns: minmax(0, 1fr); }
.pick.none .why { color: var(--ink-2); }
.pick.none .sub { font-size: 13.5px; color: var(--ink); }

/* buttons */
.btn { border: 0; background: var(--surface-3); border-radius: 10px; padding: 8px 14px; font-size: 13.5px; min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; color: var(--ink); white-space: nowrap; }
.btn:hover { background: var(--line-2); }
.btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.quiet { background: transparent; color: var(--ink-2); padding: 4px 10px; min-height: 30px; font-size: 13px; border: 1px solid var(--line-2); }
.btn.quiet:hover { color: var(--ink); border-color: var(--ink-3); background: transparent; }

/* ---------- station card ---------- */
.card { background: var(--surface-2); border-radius: 16px; padding: 14px 16px 16px; margin-bottom: 18px; }
.card .hd { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; column-gap: 12px; align-items: center; }
.card .nm { font-weight: 700; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
.card .alt { color: var(--ink-2); font-size: 12.5px; line-height: 1.35; }
.card button.x { border: 0; background: var(--surface-3); width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); align-self: start; }
.card button.x:hover { color: var(--ink); background: var(--line-2); }
.card .says { margin-top: 10px; font-size: 14px; display: flex; flex-wrap: wrap; column-gap: 12px; row-gap: 2px; align-items: baseline; }
.card .tag { font-size: 12px; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 6px; padding: 0 6px; white-space: nowrap; }
.card .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.card .fact { padding: 9px 0 8px; }
.card .fact + .fact { border-left: 1px solid var(--line); padding-left: 12px; }
.card .fact .v { font: 600 26px/1.05 var(--font-num); font-variant-numeric: tabular-nums; }
.card .fact .v small { font: 500 13px var(--font-num); color: var(--ink-2); margin-left: 2px; }
.card .fact .k { font-size: 12px; color: var(--ink-2); margin-top: 2px; line-height: 1.3; }
/* the after-class forecast borrows the board's look */
.card .chart { margin-top: 12px; }
.card .chart .cap { font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
.card .chart svg { width: 100%; height: 88px; display: block; }
.card .foot { font-size: 12px; color: var(--ink-3); margin-top: 8px; }
.card .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }

/* ---------- dispatch tab ---------- */
.stats { display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--line); }
.stat { padding: 10px 0 11px; border-bottom: 1px solid var(--line); min-width: 0; }
.stat:nth-child(odd) { padding-right: 12px; }
.stat:nth-child(even) { border-left: 1px solid var(--line); padding-left: 14px; }
.stat .v { font: 600 28px/1.05 var(--font-num); font-variant-numeric: tabular-nums; }
.stat .v small { font: 500 13px var(--font-ui); color: var(--ink-2); margin-left: 5px; }
.stat .v small + small { font: 600 14px var(--font-num); color: var(--accent); margin-left: 8px; }
.stat.plan .v small:first-of-type { color: var(--ink-2); }
.stat .k { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; line-height: 1.35; }
.stat.plan .v { color: var(--accent); }
.trip { font-size: 13px; color: var(--ink-2); margin: 0 0 8px; display: flex; flex-wrap: wrap; column-gap: 12px; }
.trip b { color: var(--ink); font-weight: 600; }
.stops { list-style: none; margin: 0; padding: 0; position: relative; }
.stops::before { content: ""; position: absolute; left: 13px; top: 18px; bottom: 18px; width: 2px; background: var(--line-2); }
.stop { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; column-gap: 12px; align-items: start; padding: 8px 0; position: relative; cursor: pointer; border-radius: 10px; }
.stop:hover { background: var(--surface-2); }
.stop .n { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font: 600 14px/1 var(--font-num); display: grid; place-items: center; box-shadow: 0 0 0 3px var(--surface); position: relative; }
.stop .act { font-weight: 600; font-size: 14.5px; }
.stop .nm { font-size: 14.5px; }
.stop .meta { color: var(--ink-2); font-size: 12.5px; }
.stop .eta { color: var(--ink-2); font-size: 12.5px; white-space: nowrap; padding-top: 2px; text-align: right; }
.stop .eta b { font: 600 15px var(--font-num); color: var(--ink); }
.load { height: 4px; background: var(--surface-3); border-radius: 2px; overflow: hidden; margin-top: 5px; width: 120px; }
.load i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.riskhead { display: grid; grid-template-columns: minmax(0, 1fr) 52px 64px 40px; gap: 10px; margin: 0 calc(-1 * var(--pad)); padding: 0 var(--pad) 2px; font-size: 11.5px; color: var(--ink-3); }
.riskhead .bk { justify-self: end; white-space: nowrap; }
.riskhead .pv { grid-column: 3 / 5; justify-self: end; white-space: nowrap; }
.risk { list-style: none; margin: 0 calc(-1 * var(--pad)); padding: 0; }
.risk li { display: grid; grid-template-columns: minmax(0, 1fr) 52px 64px 40px; gap: 10px; align-items: center; font-size: 14px; cursor: pointer; padding: 7px var(--pad); min-height: 40px; }
.risk li:hover { background: var(--surface-2); }
.risk li:focus-visible { outline-offset: -2px; }
.risk li.sel { background: var(--accent-soft); }
.risk .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.risk .tag { font-size: 11px; color: var(--ink-2); border: 1px solid var(--line-2); border-radius: 5px; padding: 0 5px; margin-left: 6px; }
.risk .tag.in { color: var(--accent); border-color: var(--accent); }
.risk .bk { font: 500 13.5px var(--font-num); color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 8px; background: var(--r0); border-radius: 4px; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--r3); border-radius: 4px; }
.risk .pv { font: 600 14px var(--font-num); text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- about tab ---------- */
.about { font-size: 14px; line-height: 1.7; }
.about p { margin: 0 0 10px; max-width: 34em; }
.about h3 { font-size: 15px; margin: 0 0 6px; font-weight: 700; }
.about a { color: var(--accent); }
.key { list-style: none; margin: 0; padding: 0; display: grid; gap: 9px; font-size: 13.5px; line-height: 1.45; }
.key li { display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: 12px; align-items: center; }
.key .sw { display: grid; place-items: center; }
.key .badge { width: 28px; height: 28px; font-size: 13px; }
.key .ln { width: 26px; height: 0; border-top: 3px dashed var(--accent); }
.langrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.credit { font-size: 12.5px; color: var(--ink-2); }
.err { color: var(--out); font-size: 13px; margin-top: 14px; background: var(--out-soft); border-radius: 10px; padding: 10px 12px; }

/* ---------- things that float over the map ---------- */
.legend { position: absolute; left: 12px; bottom: 26px; background: var(--surface); border-radius: 12px; padding: 10px 12px; font-size: 12px; z-index: 500; color: var(--ink-2); box-shadow: var(--shadow-1); max-width: 230px; line-height: 1.4; }
.legend .ttl { color: var(--ink); font-weight: 600; margin-bottom: 6px; }
.legend .ramp { display: flex; height: 8px; margin: 2px 0 3px; border-radius: 4px; overflow: hidden; }
.legend .ramp i { flex: 1; }
.legend .ends { display: flex; justify-content: space-between; font: 500 11.5px var(--font-num); }
.legend .it { display: flex; align-items: center; gap: 8px; margin-top: 5px; }
.legend .it.gap { margin-top: 9px; }
.legend .sw { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.legend .ln { width: 18px; height: 0; border-top: 3px dashed var(--accent); flex: none; }
.replaybar { position: absolute; right: 68px; bottom: 26px; left: 256px; max-width: 640px; margin-left: auto; background: var(--surface); border-radius: 14px; padding: 8px 12px; z-index: 500; display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow-1); }
.replaybar select { border: 0; background: var(--surface-3); border-radius: 9px; padding: 0 8px; height: 36px; font-size: 13.5px; max-width: 132px; }
.replaybar .play { border: 0; background: var(--accent); color: var(--on-accent); border-radius: 50%; width: 36px; height: 36px; display: grid; place-items: center; flex: none; }
.replaybar .track { flex: 1; min-width: 0; position: relative; padding-bottom: 8px; }
.replaybar input[type="range"] { width: 100%; accent-color: var(--accent); min-width: 0; margin: 0; display: block; height: 24px; }
.replaybar .marks { position: absolute; left: 8px; right: 8px; bottom: 0; height: 7px; pointer-events: none; }
.replaybar .marks i { position: absolute; top: 1px; width: 1.5px; height: 5px; background: var(--ink-3); transform: translateX(-50%); }
.replaybar .marks i.major { background: var(--ink); height: 7px; top: 0; }
.replaybar .t { font: 600 17px var(--font-num); min-width: 48px; text-align: right; font-variant-numeric: tabular-nums; }
.fab { position: absolute; right: 10px; bottom: 126px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); z-index: 500; display: grid; place-items: center; }
.fab[aria-pressed="true"] { color: var(--accent); }
.fab.busy svg { animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.hint, .toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--board); color: var(--board-ink); border-radius: 999px; padding: 8px 16px; font-size: 13.5px; z-index: 650; box-shadow: var(--shadow-1); max-width: calc(100% - 24px); text-align: center; }

/* ---------- map marks ---------- */
.glyph { position: relative; }

.stopicon { background: var(--accent); color: var(--on-accent); border-radius: 50%; width: 24px; height: 24px; display: grid; place-items: center; font: 600 13px/1 var(--font-num); box-shadow: 0 0 0 2px var(--surface), var(--shadow-1); }
.originicon { width: 18px; height: 18px; border-radius: 50%; background: var(--accent); border: 3px solid var(--surface); box-shadow: 0 0 0 6px var(--accent-soft); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent); }

/* ---------- tablet ---------- */
@media (max-width: 1099px) { :root { --side-w: 372px; --pad: 16px; } .brand .where { display: none; } .legend { display: none; } .replaybar { left: 12px; } }

/* ---------- short windows (a phone held sideways): keep the board to one line ---------- */
@media (max-height: 520px) and (min-width: 768px) { .ruler { display: none; } .board { padding-top: 10px; padding-bottom: 10px; } .board .at { font-size: 28px; } .tabs { margin-top: 8px; } }

/* ---------- borrow and return: when, the tip, the usual day, the next 90 minutes ---------- */
.origin .opts { display: inline-flex; gap: 8px; flex-wrap: wrap; }
.tip { margin: -8px 2px 0; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }

/* ---------- phone: map first, sheet over it, tabs at the bottom ---------- */
@media (max-width: 767px) {
  :root { --pad: 16px; --top-h: 58px; }
  body { font-size: 15px; }
  .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; }

  .brand, .top .spacer { display: none; }
  .mini { display: block; flex: 1 1 0; min-width: 0; }
  .mini .lbl { font-size: 12px; color: var(--board-mute); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini .left { font: 600 24px/1.1 var(--font-num); color: var(--bell); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .mini .left small { font: 500 13px var(--font-ui); margin-left: 3px; }
  .mini .left small.bt { font: 500 12.5px var(--font-ui); color: var(--board-mute); margin: 0 8px 0 0; }
  .mini .left.calm { color: var(--board-ink); font-size: 18px; font-family: var(--font-ui); line-height: 1.35; }
  .top .seg { background: var(--board-2); }
  .top .seg button { color: var(--board-mute); padding: 5px 11px; min-height: 32px; }

  .status { position: fixed; z-index: 640; left: calc(10px + var(--safe-l)); top: calc(var(--top-h) + var(--safe-t) + 10px); background: var(--surface); color: var(--ink-2); border-radius: 999px; padding: 5px 11px 5px 9px; box-shadow: var(--shadow-1); font-size: 12px; max-width: calc(100vw - 80px); overflow: hidden; text-overflow: ellipsis; }
  .shell[data-mode="replay"] .status { display: none; }
  .side { display: contents; }
  .board { display: none; }
  .mapwrap { grid-column: 1; grid-row: 2; }
  .tabs { grid-column: 1; grid-row: 3; margin: 0; border-radius: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 0 max(6px, var(--safe-r)) var(--safe-b) max(6px, var(--safe-l)); gap: 0; z-index: 700; position: relative; }
  .tabs button { flex-direction: column; gap: 2px; min-height: var(--nav-h); border-radius: 0; font-size: 11.5px; color: var(--ink-3); padding: 6px 4px; }
  .tabs button[aria-selected="true"] { background: transparent; color: var(--accent); box-shadow: none; font-weight: 600; }
  .panel { position: fixed; z-index: 660; left: 0; right: 0; bottom: calc(var(--nav-h) + var(--safe-b) + 1px); height: var(--sheet-full, 70vh); background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: var(--shadow-2);
    grid-template-rows: auto minmax(0, 1fr); transform: translateY(var(--sheet-y, 50%)); transition: transform 0.26s cubic-bezier(0.22, 0.9, 0.3, 1); will-change: transform; touch-action: none; }
  .panel.dragging { transition: none; }
  .grip { display: block; border: 0; background: transparent; width: 100%; height: 30px; padding: 0; touch-action: none; cursor: grab; border-radius: 18px 18px 0 0; }
  .grip::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line-2); margin: 0 auto; }
  .scroll { padding: 0 max(var(--pad), var(--safe-r)) 24px max(var(--pad), var(--safe-l)); height: var(--sheet-vis, auto); max-height: 100%; }
  .shell[data-sheet="full"] .panel { touch-action: pan-y; }
  .shell:not([data-sheet="full"]) .scroll { overflow-y: hidden; }
  .pane { gap: 18px; }
  .row { min-height: 68px; }
  .risk li { min-height: 46px; }
  .fab { bottom: calc(var(--sheet-up, 160px) + 14px); right: calc(12px + var(--safe-r)); transition: bottom 0.26s cubic-bezier(0.22, 0.9, 0.3, 1); width: 48px; height: 48px; }
  .shell[data-sheet="full"] .fab { display: none; }
  .toast { left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 14px); border-radius: 14px; }
  .legend { display: none; }
  .replaybar { left: calc(10px + var(--safe-l)); right: calc(10px + var(--safe-r)); top: 10px; bottom: auto; max-width: none; padding: 7px 10px; gap: 8px; }
  .replaybar select { max-width: 104px; padding: 0 4px; }
  .hint { top: 54px; }
  .shell[data-mode="replay"] .hint { top: 104px; }
  .leaflet-control-zoom, .leaflet-control-scale { display: none; }
  .leaflet-top.leaflet-right .leaflet-control-attribution { margin: 10px calc(10px + var(--safe-r)) 0 0; border-radius: 999px; padding: 2px 9px; box-shadow: var(--shadow-1); background: var(--surface) !important; }

@media (max-width: 359px) { .mini .left { font-size: 21px; } .top .seg button { padding: 5px 8px; } .row .walk { font-size: 16px; } }
@media (prefers-reduced-motion: reduce) { .route-line, .fab.busy svg { animation: none; } * { transition: none !important; } }

/* from and to: two native selectors side by side; the return tab shows only "to" */
.trip { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.trip .sel { display: grid; gap: 3px; min-width: 0; }
.trip .sel[hidden] + .sel, .trip .sel:only-child { grid-column: 1 / -1; }
.trip .k { font-size: 12px; color: var(--ink-2); padding-left: 2px; }
.trip select, .remform select { appearance: none; -webkit-appearance: none; width: 100%; min-height: 40px; padding: 7px 30px 7px 12px; border-radius: 12px; border: 1px solid var(--line-2); background-color: var(--surface); color: var(--ink);
  font: inherit; font-size: 14.5px; font-weight: 600; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 16px) 17px, calc(100% - 11px) 17px; background-size: 5px 5px; background-repeat: no-repeat; }
.trip select:focus-visible, .remform select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.pick.poor { background: var(--out-soft); } .pick.poor .why { color: var(--out); }
.pick.walkit { background: var(--surface-2); cursor: default; }
.pick.walkit .why { color: var(--ink-2); } .pick.walkit .badge { color: var(--ink-2); }
.tip { line-height: 1.6; }
.laterbar svg { display: block; width: 100%; height: auto; }
.originicon.to { background: var(--surface); border-color: var(--accent); }

/* the operator's NT$5 reward: a small mark after a station's name, one line under the suggestion, one in the card */
.relay { display: inline-block; margin-left: 6px; padding: 0 5px; border-radius: 5px; font-size: 11.5px; font-weight: 600; line-height: 1.5; white-space: nowrap; vertical-align: 1px; color: var(--accent); border: 1px solid var(--accent); }
.relayline { color: var(--ink); }
.relaynote { margin-top: 8px; font-size: 13.5px; line-height: 1.5; color: var(--ink-2); }
.relaynote .relay { margin-left: 0; margin-right: 6px; }

/* ten dots per departure: the key under the chart */
.dotkey { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; font-size: 12px; color: var(--ink-2); }
.dotkey span { display: inline-flex; align-items: center; gap: 6px; }
.dotkey i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.dotkey i.ok { background: var(--ok-fill); } .dotkey i.low { background: var(--low-fill); } .dotkey i.out { background: var(--out-fill); }
/* how full a station usually is at this time */
.usualnote { margin-top: 6px; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
/* the reward on the map, and the filter that leaves only those stations bright */
.glyph .rmark { position: absolute; left: -10px; top: -7px; padding: 0 3px; border-radius: 4px; font-size: 10px; font-weight: 700; line-height: 14px; color: var(--accent); background: var(--surface); border: 1px solid var(--accent); pointer-events: none; }
#map.relayonly .glyph:not(.paid) { opacity: 0.3; }
h2 .h2r { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
.opt.chip { min-height: 30px; padding: 3px 11px; font-size: 12.5px; }
/* class-end reminders */
.remind { margin: 2px 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.remind summary { cursor: pointer; padding: 10px 14px; font-size: 13.5px; color: var(--ink); min-height: 44px; display: flex; align-items: center; list-style: none; }
.remind summary::-webkit-details-marker { display: none; }
.remind summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(-45deg); margin-right: 10px; transition: transform .15s; }
.remind[open] summary::before { transform: rotate(45deg); }
.remform { padding: 0 14px 12px; display: grid; gap: 10px; }
.remform .sel { display: grid; gap: 4px; }
.remform .sel .k, .remform .origin .k { font-size: 12.5px; color: var(--ink-2); }
.remform select { min-height: 40px; }
.remgo { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.remform .note { margin: 0; font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
@media (prefers-reduced-motion: reduce) { .remind summary::before { transition: none; } }


/* ---------- the Policy tab ---------- */
.policy .lead { font-size: 14.5px; line-height: 1.75; margin: 4px 0 12px; max-width: 34em; }
.ptag { font-size: 11.5px; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: 5px; padding: 0 6px; line-height: 1.6; }
.polchart svg { display: block; width: 100%; height: auto; }

.poltab thead th { font-size: 11.5px; font-weight: 500; color: var(--ink-3); padding-top: 4px; white-space: normal; vertical-align: bottom; line-height: 1.3; }
.poltab th:first-child, .poltab td:first-child { padding-left: 0; }
.poltab .n { text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.poltab tbody th { font-weight: 600; }
.poltab td.pay { color: var(--accent); font-weight: 700; }
.poltab td.no { color: var(--ink-3); }
.poltab tbody tr { cursor: pointer; }
.poltab tbody tr:hover { background: var(--surface-2); }
.polsum { font-size: 14px; font-weight: 600; margin: 10px 0 0; }
.sim { border: 1px solid var(--line); border-radius: 14px; padding: 2px 14px 12px; margin: 10px 0 12px; background: var(--surface); }
.simrow { display: flex; flex-direction: column; gap: 6px; margin: 10px 0 0; }
.simrow .k { font-size: 12.5px; color: var(--ink-2); }
.simrow .opts { display: flex; flex-wrap: wrap; gap: 6px; }
.simout { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.simout .big { font: 700 28px/1.1 var(--font-num); color: var(--accent); }
.simout .big.asis { color: var(--ink-2); font-size: 22px; }
.simout .unit { font-size: 12.5px; color: var(--ink-3); margin: 6px 0 4px; }
.simbar { display: grid; grid-template-columns: 3.2em minmax(0, 1fr) 2.6em; align-items: center; gap: 8px; margin: 3px 0; }
.simbar .k { font-size: 12.5px; color: var(--ink-2); }
.simbar .track { height: 10px; border-radius: 3px; background: var(--surface-3); overflow: hidden; }
.simbar .track i { display: block; height: 100%; border-radius: 3px; }

.asks { padding-left: 1.3em; margin: 6px 0 14px; }

    keyYes: "綠色「有車」：12 個上課日實測，99% 走到時真的有車。還車頁的「有空位」也是 99%。", keyMaybe: "黃色「車不多」：81% 走到時還有車。還車頁「空位不多」是 75%。", keyNo: "紅色「快沒車」：62% 走到時還有車，常要改去別站。還車頁「快停滿」是 53%。",

    aboutWhat: "<h3>網站用途</h3><p>中山大學上課日傍晚 17:30 到 18:10，校內的 YouBike 常被借光：從校內出發，平均要 5 分鐘才借得到車，每 8 次有 1 次超過 10 分鐘；其他時段約 2 分鐘。早上 9 點到 11 點則相反，校內的站常停滿，不好還車。</p><p>這個網站算出你走到每一站時有沒有車或空位，直接告訴你去哪一站、最晚幾點出發、騎車和走路哪個快。也可以設定在下課前 5 分鐘用手機行事曆提醒你。</p><p>傍晚整個校園一起沒車時，查車幫不上忙，所以「政策」分頁算給學校、市府和營運商看：現行的 5 元獎勵為什麼發得太晚、提前到下課前改送騎乘時數的效果，以及下課前補車的效果。</p>",
    aboutProof: "<h3>準確度</h3><p>我們用 12 個上課日的紀錄檢驗，這 12 天沒有用來建立預估。</p><p>站的標示：標「有車」的站（占所有情況的 82%），99% 走到時真的有車。標「車不多」的，81% 走到時還有車；「快沒車」的是 62%；現在沒車的站，22% 在你走到前補進車。還車頁的「有空位」也是 99%。檢查的是校園到捷運之間 19 站，07:00 到 21:50，走 1 到 30 分鐘到站的情況。</p><p>出發前的預估：提前 10 到 30 分鐘判斷「這趟會不會要找超過 8 分鐘」，網站的準確度明顯比只看當下車數高（AUC 0.86–0.90，只看車數是 0.69–0.78；AUC 為 1 代表完全正確，0.5 等於隨機猜）。「晚點出發的找車時間」也驗證過：紅點標示 10% 的出發時間，實際有 9% 找超過 8 分鐘；標示 30% 的，實際是 28%；沒有紅點的，實際是 1%。</p><p>選哪一站：假設每 10 分鐘有人在某一站附近要借車，照網站建議、看官方 App 找最近有車的站，或直接走到最近的站，傍晚平均都約 3.7 分鐘借到車；第一站沒車就走到下一站。挑站的結果和看官方 App 差不多，網站的用處是出發前就告訴你會不會難借、最晚幾點要走。網站第一版只推薦有車機率 90% 以上的站，反而要 5.3 分鐘，因為常要多走一段路，所以改成現在的選法。</p><p>騎車和走路：傍晚從校內到捷運站，借車騎過去全程平均 11.6 分鐘，走路 17.3 分鐘。</p>",
    aboutHow: "<h3>資料與方法</h3><p>資料來源：YouBike 官方開放資料。從 2026 年 10 月 1 日起，每 10 分鐘記錄一次中山大學周邊 5 公里內 {n} 個站的車數和空位。網站開著時，校園到捷運之間的 19 站每分鐘再更新一次。</p><p>預估方法：用過去的紀錄算出每一站在上課日每 10 分鐘的平均借車和還車速度（下課那 10 分鐘特別快），再從現在的車數推算你到達時的車數和有車的機率，統計上稱為生滅過程模型。走到時有車的機率在 90% 以上，標「有車」（綠色）；60% 到 90% 標「車不多」（黃色）；不到 60% 標「快沒車」（紅色）；現在沒車而且機率不到 60%，標「現在沒車」（深紅）。還車看有空位的機率，標準較嚴，分別是 95% 和 70%。</p><p>建議的站：比較每一站「走過去的時間，加上沒車時改去下一站的時間」，選平均最快的一站；差不到半分鐘時，選有車機率較高的一站。步行和騎車時間依 OpenStreetMap 的路線距離計算，步行每分鐘 80 公尺、騎車每分鐘 200 公尺，未考慮坡度。</p><p>調度：調度頁替一台負責校園周邊的卡車規劃路線。先預估每一站未來 {h} 分鐘會有多少人借不到車，再決定去哪一站載車、送到哪一站。卡車一次最多載 {q} 台，時速 {s} 公里，每站停 {st} 分鐘。模擬結果，一台卡車可讓傍晚校內借不到車的人次減少 34%，早上山下減少 70%。用臺大的真實騎乘紀錄測試，1、3、6 台卡車分別減少 13%、30%、45%。</p><p>政策試算：從 12 個上課日每天 15:00（早上 08:00）的實際車數出發，用同一個生滅過程模型往後算，比較不同做法下借不到車和還不了車的人次。預測型友愛接力（送一小時騎乘時數）在 40 分鐘內借空機率一半以上的站提高還車量（早上是在快停滿的站提高借車量）；補車在 16:50、17:50 把車直接加進車數（早上 09:00 載走）；錯開下課是讓 17:00 和 18:00 下課的課有一半提早 10 分鐘，16:40 到 18:40 每 10 分鐘的借車量改成這一格和下一格的平均。程式在 analysis/code/final_reward.py 和 final_policy.py。</p><p>調度頁的「30 分鐘內快借光」使用另一個機器學習模型 LightGBM，先用臺大周邊 10 個月的資料訓練，再用中山的資料調整。</p><p>隱私：「我的站」和你選的地點只存在這台裝置的瀏覽器，不會上傳。</p>",

    aboutWhat: "<h3>What this site does</h3><p>On teaching days between 17:30 and 18:10, YouBikes on the NSYSU campus often run out: leaving from campus, it takes 5 minutes on average to get a bike, and more than 10 minutes one time in eight. At other times it takes about 2 minutes. From 09:00 to 11:00 the opposite happens and campus stations are often full.</p><p>This site works out whether each station will have a bike, or a free dock, when you get there. It tells you which station to go to, the latest time to leave, and whether riding beats walking. It can also remind you through your phone's calendar 5 minutes before class ends.</p><p>When the whole campus runs out in the evening, no app can help, so the Policy tab is for the school, the city and the operator: why today's NT$5 voucher comes too late, what a reward paid in ride time before the bell would do, and what a truck before the bell would do.</p>",
    aboutProof: "<h3>Accuracy</h3><p>We tested the site on 12 teaching days that were not used to build the estimates.</p><p>Station labels: of the stations labelled \"Bikes available\" (82% of all cases), 99% really had a bike when the rider got there. \"Few bikes\" still had one 81% of the time, \"Almost out\" 62%, and a station with no bikes got one back before the rider arrived 22% of the time. \"Docks available\" on Return was right 99% of the time too. The check covers the 19 stations between campus and the metro, 07:00 to 21:50, and walks of 1 to 30 minutes.</p><p>Forecasting before you leave: 10 to 30 minutes ahead, the site tells a search over 8 minutes from a quick one clearly better than the current counts can (AUC 0.86–0.90 against 0.69–0.78; 1 is perfect, 0.5 is guessing). The search-time dots were checked too: where the red dots showed 10%, 9% of the searches took over 8 minutes; at 30%, 28%; with no red, 1%.</p><p>Choosing a station: every 10 minutes, a rider near each station picks a station by one of several methods, walking on to the next station if the first has none. Following the site, checking the operator's app for the nearest station with bikes, and walking to the nearest station all take about 3.7 minutes in the evening. Picking the station is no faster than with the operator's app; what the site adds is knowing before you leave whether it will be hard, and the latest time to go. The site's first version only suggested stations with a 90% chance of a bike; that took 5.3 minutes because of the extra walking, so the rule was changed.</p><p>Riding or walking: from campus to the metro in the evening, borrowing a bike and riding takes 11.6 minutes in total on average; walking takes 17.3.</p>",
    aboutHow: "<h3>Data and methods</h3><p>Data: YouBike's official open data. Since 1 October 2026 we have recorded the bikes and free docks at the {n} stations within 5 km of NSYSU every 10 minutes. While the site is open, the 19 stations between campus and the metro are refreshed every minute.</p><p>Estimates: from the records, we estimate each station's average borrowing and returning rates for every 10 minutes of a teaching day (the 10 minutes after a class ends are much busier), then project from the current count to the minute you arrive (a birth-death process). A station whose chance of a bike when you get there is 90% or more is labelled \"Bikes available\" (green); 60% to 90%, \"Few bikes\" (yellow); under 60%, \"Almost out\" (red); with no bikes now and under 60%, \"No bikes now\" (dark red). For docks the thresholds are stricter: 95% and 70%.</p><p>Suggested station: for each station the site adds the walk there and, if the station might be empty, the walk on to the next one, and picks the fastest on average; within half a minute of that, it picks the station most likely to have a bike. Walking and riding times use route lengths from OpenStreetMap at 80 m and 200 m per minute, without slopes.</p><p>Dispatch: the Dispatch tab plans a route for one truck serving the campus area. It estimates how many riders will find no bike at each station in the next {h} minutes, then decides where to load bikes and where to drop them. A truck carries up to {q} bikes, drives at {s} km/h and stops {st} minutes per station. In simulation, one truck cuts failed rentals by 34% on campus in the evening and by 70% at the foot of the campus in the morning. On real trip records from NTU, 1, 3 and 6 trucks cut them by 13%, 30% and 45%.</p><p>Policy what-if: starting from the actual counts at 15:00 (08:00 in the morning) on the 12 teaching days, the same birth-death model is run forward to compare the riders left without a bike, and the returns refused, under each change. The predictive reward (an hour of riding) raises returns at stations with at least an even chance of running empty within 40 minutes (in the morning, rentals at stations about to fill); a truck adds its bikes at 16:50 and 17:50 (in the morning it takes 20 away at 09:00); staggering ends half of the 17:00 and 18:00 classes 10 minutes early, so from 16:40 to 18:40 the rentals of each 10 minutes become the mean of that slot and the next. The code is analysis/code/final_reward.py and final_policy.py.</p><p>\"Running out within 30 min\" on the Dispatch tab comes from a separate machine-learning model (LightGBM), trained on 10 months of data around NTU and adjusted with NSYSU data.</p><p>Privacy: \"My stations\" and the places you choose are stored only in this browser.</p>",
