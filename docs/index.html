/* layout: a top bar, a 420px side panel (countdown, KPIs, truck plan, risk list, station card) beside a full-height map;

:root {
  --bg: #f3f2ed; --panel: #ffffff; --panel2: #f8f7f3; --fg: #1a1a17; --fg2: #5b5955; --muted: #8e8c86; --line: #e2e0da; --line2: #cfccc4;

  --map-bg: #e8ebee; --tile-filter: saturate(0.25) brightness(1.04) contrast(0.92);
  --r0: #eceae2; --r1: #f6d8bf; --r2: #ec9a6b; --r3: #d6502a; --r4: #8c1a0a;
  --shadow: 0 2px 12px rgba(20, 20, 10, 0.12);
  --font-ui: "IBM Plex Sans", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-num: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
}

  --bg: #121418; --panel: #1a1d23; --panel2: #20242b; --fg: #ebe9e2; --fg2: #b3b1aa; --muted: #7d7b75; --line: #2d3139; --line2: #3c414b;
  --accent: #76aef2; --accent-soft: #1f2d42; --route: #ff8a5c; --route-soft: #3b2920; --good: #4fc083; --warn: #e0a84a;

html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.shell { display: grid; grid-template-rows: auto 1fr; height: 100%; }
.top { display: flex; align-items: center; gap: 14px; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; flex-wrap: wrap; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand .eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--fg2); font-weight: 600; white-space: nowrap; }
.brand h1 { font-size: 15px; font-weight: 600; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 7px; overflow: hidden; background: var(--panel2); }
.seg button { background: transparent; border: 0; padding: 5px 11px; font-size: 12.5px; cursor: pointer; color: var(--fg2); }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--panel); }
.daysel { border: 1px solid var(--line2); border-radius: 7px; background: var(--panel2); color: var(--fg); font: inherit; font-size: 12.5px; padding: 4px 8px; }
.status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--fg2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.status.stale .dot { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 25%, transparent); }
.status.replay .dot { background: var(--route); box-shadow: 0 0 0 3px color-mix(in srgb, var(--route) 25%, transparent); }

  }
  function renderLegend(v) {
    var ends = horizon === 90 ? "<span>0</span><span>5</span><span>10+</span>" : "<span>0</span><span>0.5</span><span>1</span>";
    document.getElementById("legend").innerHTML = "<div>" + (horizon === 90 ? t("legendU", { h: v.meta.horizon_min }) : t("legend", { h: horizon })) + "</div><div class=\"ramp\"><i style=\"background:var(--r0)\"></i><i style=\"background:var(--r1)\"></i><i style=\"background:var(--r2)\"></i><i style=\"background:var(--r3)\"></i><i style=\"background:var(--r4)\"></i></div><div class=\"ends\">" + ends + "</div>" +
      "<div class=\"row\">" + t("legRing") + "</div><div class=\"row\">" + t("legCampus") + "</div><div class=\"row\"><span class=\"ln\"></span>" + t("legRoute") + "</div><div class=\"row\">" + t("legGrey") + "</div>";
  }
  function renderStatus(v) {
    var st = document.getElementById("status"), tx = document.getElementById("statusText");
    st.className = "status";
    if (mode === "replay") { st.classList.add("replay"); tx.textContent = t("replayAt", { d: replay.date, t: v.snapshot_at.slice(11) }); return; }
    var n = taipeiNow(), snap = v.snapshot_at, agoMin = Math.max(0, Math.round((n - new Date(snap.replace(" ", "T") + ":00")) / 60000));
    if (agoMin > 25) st.classList.add("stale");
    tx.textContent = t("liveAt", { t: snap.slice(11) }) + t("ago", { m: agoMin });
    var el = document.getElementById("err");
    if (agoMin > 60) { el.hidden = false; el.textContent = t("stalebig", { m: agoMin }); } else if (el.textContent.indexOf("HTTP") < 0) { el.hidden = true; }
  }
  function renderChrome() {
    document.getElementById("title").textContent = t("title"); document.title = lang === "zh" ? "Beat the Bell 中山即時調度" : "Beat the Bell NSYSU Live";
    document.getElementById("mLive").textContent = t("live"); document.getElementById("mReplay").textContent = t("replay"); fillDays();
    document.getElementById("aboutSum").textContent = t("aboutSum");
    document.getElementById("h30").textContent = "30 " + t("min"); document.getElementById("h60").textContent = "60 " + t("min"); document.getElementById("hU").textContent = t("modeU");
    var v = view(); var s = v ? v.meta.settings : { Q: 20, speed_kmh: 15, stop_min: 3 };
    document.getElementById("aboutBody").innerHTML = t("aboutBody", { h: v ? v.meta.horizon_min : 90, q: s.Q, s: s.speed_kmh, st: s.stop_min });
  }
  function render() {
    var v = view(); renderChrome(); if (!v) return;
    renderStatus(v); renderBell(v); renderKpis(v); renderPlans(v); renderRisk(v); renderCard(v); renderLegend(v); drawStations(v); drawRoute(v);
    if (mode === "replay") { var sl = document.getElementById("slider"); sl.max = replay.slots.length - 1; sl.value = slot; document.getElementById("sliderT").textContent = replay.slots[slot].snapshot_at.slice(11);
      var n = replay.slots.length, t0 = replay.slots[0].t_min, t1 = replay.slots[n - 1].t_min, hh = "";
      replay.bells.forEach(function (b) { var bm = parseInt(b.slice(0, 2), 10) * 60 + parseInt(b.slice(3), 10); if (bm < t0 || bm > t1) return; hh += "<i class=\"" + (replay.major_bells.indexOf(b) >= 0 ? "major" : "") + "\" style=\"left:" + (100 * (bm - t0) / (t1 - t0)).toFixed(2) + "%\"></i>"; });
      document.getElementById("sticks").innerHTML = hh; }
  }
  function select(i) { selected = i; var v = view(); if (!v) return; renderCard(v); renderRisk(v); drawStations(v); if (i != null && markers[i]) markers[i].setZIndexOffset(800); }

  // ---------- data ----------
  function loadLive() {
    var url = /claude\.ai$/.test(location.hostname) || location.protocol === "file:" ? "state.json" : "state.json?t=" + Math.floor(Date.now() / 60000);
    return fetch(url, { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (s) { live = s; document.getElementById("err").hidden = true; if (mode === "live") render(); })
      .catch(function (e) { var el = document.getElementById("err"); el.hidden = false; el.textContent = (live ? t("stale", { t: live.snapshot_at.slice(11) }) : e.message); if (live && mode === "live") { render(); document.getElementById("status").classList.add("stale"); } });
  }
  function loadReplay(day) {
    if (replays[day]) { replay = replays[day]; return Promise.resolve(replay); }
    return fetch("replay_" + day + ".json").then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(function (s) { replays[day] = s; replay = s; return s; });
  }
  function dayLabel(d) { var dt = new Date(d + "T12:00:00+08:00"), wd = lang === "zh" ? ["日", "一", "二", "三", "四", "五", "六"] : ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    return lang === "zh" ? (dt.getMonth() + 1) + "/" + dt.getDate() + "（" + wd[dt.getDay()] + "）" : wd[dt.getDay()] + " " + ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][dt.getMonth()] + " " + dt.getDate(); }
  function fillDays() { var sel = document.getElementById("replayDay"); sel.innerHTML = replayDays.map(function (d) { return "<option value=\"" + d + "\"" + (d === replayDay ? " selected" : "") + ">" + dayLabel(d) + "</option>"; }).join(""); }
  function loadDays() {
    return fetch("replays.json", { cache: "no-store" }).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (j) { if (j.days && j.days.length) { replayDays = j.days; if (replayDays.indexOf(replayDay) < 0) replayDay = replayDays[0]; } }).catch(function () {}).then(fillDays);
  }
  function setMode(m) {
    mode = m; document.getElementById("mLive").setAttribute("aria-pressed", m === "live"); document.getElementById("mReplay").setAttribute("aria-pressed", m === "replay");
    document.getElementById("replaybar").hidden = m !== "replay"; document.getElementById("replayDay").hidden = m !== "replay"; stopPlay();
    if (m === "replay") loadReplay(replayDay).then(function () { slot = Math.min(slot || 0, replay.slots.length - 1); if (!slot) { var i = replay.slots.findIndex(function (x) { return x.t_min >= 15 * 60 + 30; }); slot = i < 0 ? 0 : i; } render(); })
      .catch(function (e) { var el = document.getElementById("err"); el.hidden = false; el.textContent = "replay: " + e.message; });
    else render();
  }
  function stopPlay() { playing = false; document.getElementById("play").textContent = "▶"; if (playTimer) { clearInterval(playTimer); playTimer = null; } }
  function togglePlay() {
    if (playing) { stopPlay(); return; }
    playing = true; document.getElementById("play").textContent = "❚❚";
    playTimer = setInterval(function () { if (!replay) return; slot = (slot + 1) % replay.slots.length; render(); }, 700);
  }
  document.getElementById("mLive").addEventListener("click", function () { setMode("live"); });
  document.getElementById("mReplay").addEventListener("click", function () { setMode("replay"); });
  document.getElementById("replayDay").addEventListener("change", function (e) { replayDay = e.target.value; stopPlay(); loadReplay(replayDay).then(function () { slot = Math.min(slot, replay.slots.length - 1); render(); }); });
  document.getElementById("lZh").addEventListener("click", function () { setLang("zh"); });
  document.getElementById("lEn").addEventListener("click", function () { setLang("en"); });
  function setLang(l) { lang = l; document.getElementById("lZh").setAttribute("aria-pressed", l === "zh"); document.getElementById("lEn").setAttribute("aria-pressed", l === "en"); document.documentElement.lang = l === "zh" ? "zh-Hant" : "en"; try { localStorage.setItem("btb-lang", l); } catch (e) {} render(); }
  document.getElementById("h30").addEventListener("click", function () { setH(30); });
  document.getElementById("h60").addEventListener("click", function () { setH(60); });
  document.getElementById("hU").addEventListener("click", function () { setH(90); });
  function setH(h) { horizon = h; document.getElementById("h30").setAttribute("aria-pressed", h === 30); document.getElementById("h60").setAttribute("aria-pressed", h === 60); document.getElementById("hU").setAttribute("aria-pressed", h === 90); render(); }
  document.getElementById("play").addEventListener("click", togglePlay);
  document.getElementById("slider").addEventListener("input", function (e) { stopPlay(); slot = parseInt(e.target.value, 10); render(); });
  try { var saved = localStorage.getItem("btb-lang"); if (saved === "en") { lang = "en"; document.getElementById("lZh").setAttribute("aria-pressed", "false"); document.getElementById("lEn").setAttribute("aria-pressed", "true"); } } catch (e) {}

  initMap(); renderChrome(); loadLive(); loadDays();
  setInterval(function () { if (mode === "live") { loadLive(); } }, 60000);
  setInterval(function () { var v = view(); if (v && mode === "live") { renderBell(v); renderStatus(v); } }, 15000);
})();
</script>
